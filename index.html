<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 8px; font-size: 16px; }
    button { padding: 8px 14px; cursor: pointer; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #ddd; }
    li span { flex: 1; cursor: pointer; }
    li.feita span { text-decoration: line-through; color: #888; }
  </style>
</head>
<body>
  <h1>Lista de Tarefas</h1>
  <form id="formulario">
    <input type="text" id="nova" placeholder="Digite uma tarefa" required>
    <button type="submit">Adicionar</button>
  </form>
  <ul id="lista"></ul>

  <script>
    const form = document.getElementById("formulario");
    const campo = document.getElementById("nova");
    const lista = document.getElementById("lista");

    form.addEventListener("submit", function (evento) {
      evento.preventDefault();
      const texto = campo.value.trim();
      if (texto === "") return;

      const item = document.createElement("li");

      const textoTarefa = document.createElement("span");
      textoTarefa.textContent = texto;
      textoTarefa.addEventListener("click", function () {
        item.classList.toggle("feita");
      });

      const apagar = document.createElement("button");
      apagar.textContent = "Excluir";
      apagar.addEventListener("click", function () {
        item.remove();
      });

      item.appendChild(textoTarefa);
      item.appendChild(apagar);
      lista.appendChild(item);
      campo.value = "";
      campo.focus();
    });
  </script>
</body>
</html>
